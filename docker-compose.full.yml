name: igra-orchestra-${NETWORK}-full

volumes:
  kaspad_data:
  viaduct_data:
  traefik_certs:
  reth_ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
  shared_config:

networks:
  igra-network:
  traefik-network:

x-default-logging: &default-logging
  driver: "${LOGGING_DRIVER:-json-file}"
  options:
    max-size: "100m"
    max-file: "2"
    tag: "igra-orchestra-${NETWORK}/{{.Name}}/{{.ID}}"

x-default-healthcheck: &default-healthcheck
  interval: 10s
  timeout: 2s
  retries: 3
  start_period: 5s

x-default-service: &default-service
  restart: unless-stopped
  networks:
    - igra-network
  logging: *default-logging
  deploy:
    resources:
      limits:
        memory: 4G
        cpus: '2.0'
      reservations:
        memory: 2G
        cpus: '1.0'

x-rpc-provider-environment: &rpc-provider-environment
  RUST_LOG: ${RUST_LOG}
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: 8535
  EL_URL: http://execution-layer:8545
  SECURITY_ENABLE_WHITELIST: "true"
  READ_ONLY: ${RPC_READ_ONLY}
  MIN_PROTOCOL_FEE_PER_GAS_GWEI: ${MIN_PROTOCOL_FEE_PER_GAS_GWEI}

x-rpc-provider-base: &rpc-provider-base
  <<: *default-service
  image: igranetwork/rpc-provider:v0.2.1
  environment: *rpc-provider-environment
  expose:
    - "8535"
  entrypoint: ["/app/igra-rpc-provider"]
  networks:
    - igra-network
    - traefik-network
  labels:
    - "traefik.enable=true"
    - >
      traefik.http.routers.rpc0.rule=
      (Host(`${IGRA_ORCHESTRA_DOMAIN}`) && (PathPrefix(`/${RPC_ACCESS_TOKEN_1}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_2}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_3}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_4}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_5}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_6}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_7}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_8}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_9}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_10}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_11}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_12}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_13}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_14}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_15}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_16}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_17}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_18}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_19}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_20}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_21}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_22}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_23}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_24}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_25}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_26}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_27}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_28}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_29}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_30}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_31}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_32}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_33}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_34}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_35}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_36}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_37}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_38}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_39}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_40}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_41}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_42}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_43}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_44}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_45}`) ||
      PathPrefix(`/${RPC_ACCESS_TOKEN_46}`)))
    - "traefik.http.routers.rpc0.entrypoints=rpc"
    - "traefik.http.routers.rpc0.tls=true"
    - "traefik.http.routers.rpc0.tls.certresolver=myresolver"
    - "traefik.http.routers.rpc0.middlewares=strip-token,cors"
    - "traefik.http.services.rpc0.loadbalancer.server.port=8535"

x-kaswallet-base: &kaswallet-base
  <<: *default-service
  image: igranetwork/kaswallet:v0.2.1
  expose:
    - "8082"
  environment:
    - RUST_LOG
  extra_hosts:
    - "host.docker.internal:host-gateway"
  command: >
    --${NETWORK}
    --logs-level=${RUST_LOG}
    --keys /keys/keys.json
    --server ws://${KASPAD_HOST}:${KASPAD_BORSH_PORT}
    --listen 0.0.0.0:8082

services:
  # SYNC ORCHESTRATOR SERVICE
  sync-orchestrator:
    <<: *default-service
    restart: "no"
    image: docker:latest
    container_name: sync-orchestrator
    command:
      - sh
      - -c
      - |
        apk add --no-cache docker-cli-compose coreutils bash >/dev/null 2>&1 &&
        exec bash << 'ENDBASH'
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "   IGRA ORCHESTRA - SYNC ORCHESTRATOR"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        
        # Get the host path for the compose directory
        # sync-orchestrator mounts the host directory to /compose
        # We need to use the host path when running docker compose commands for path resolution
        # But use /compose/.env for environment variables (mounted from host)
        COMPOSE_HOST_PATH=$$(docker inspect sync-orchestrator --format '{{range .Mounts}}{{if eq .Destination "/compose"}}{{.Source}}{{end}}{{end}}' 2>/dev/null || echo "/root/igra-orchestra-public")
        export COMPOSE_HOST_PATH
        export COMPOSE_PROJECT_DIR="$$COMPOSE_HOST_PATH"
        # Use .env from inside container (mounted from host)
        COMPOSE_ENV_FILE="/compose/.env"
        export COMPOSE_ENV_FILE
        
        echo "▶ Waiting for kaspad to sync (this may take 4-6 hours)..."
        echo ""
        
        # Use NUM_WORKERS from environment (default to 1)
        NUM_WORKERS=${NUM_WORKERS:-1}
        
        # Wait for kaspad sync indefinitely until sync completes
        until docker logs kaspad --tail 2000 2>/dev/null | grep -E -q "(IBD:.* blocks \(100%\)|Accepted .* blocks .* via relay)"; do
          sleep 10
        done
        
        # Sync completed successfully, proceed with deployment
        echo "✅ Kaspad synced!"
        echo "▶ Starting kaswallet-0..."
        
        # Remove any container stuck in created/exited state
        CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' kaswallet-0 2>/dev/null || echo "")
        if [ "$$CONTAINER_STATE" = "created" ] || [ "$$CONTAINER_STATE" = "exited" ]; then
          echo "  Removing stuck container kaswallet-0 (state: $$CONTAINER_STATE)..."
          docker rm -f kaswallet-0 >/dev/null 2>&1 || true
        fi
        
        docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full up -d --remove-orphans kaswallet-0
        
        # Verify container actually started and is running
        sleep 2
        CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' kaswallet-0 2>/dev/null || echo "missing")
        if [ "$$CONTAINER_STATE" != "running" ]; then
          echo "⚠️  Kaswallet-0 failed to start (state: $$CONTAINER_STATE), removing and retrying..."
          docker rm -f kaswallet-0 >/dev/null 2>&1 || true
          docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full up -d --force-recreate kaswallet-0
          
          # Verify again
          sleep 2
          CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' kaswallet-0 2>/dev/null || echo "missing")
          if [ "$$CONTAINER_STATE" != "running" ]; then
            echo "❌ Kaswallet-0 still not running after retry (state: $$CONTAINER_STATE)"
          fi
        fi
        echo "✅ Kaswallet-0 started"
        
        echo "▶ Waiting for kaswallet-0 to connect..."
        timeout 300 bash -c "until docker inspect --format='{{.State.Health.Status}}' kaswallet-0 2>/dev/null | grep -q 'healthy'; do sleep 10; done"
        echo "✅ Kaswallet-0 ready!"
        
        # Start additional workers if NUM_WORKERS > 1
        if [ $$NUM_WORKERS -gt 1 ]; then
          echo "▶ Starting additional workers ($$NUM_WORKERS total)..."
          
          # Determine which profile to use based on NUM_WORKERS
          case $$NUM_WORKERS in
            2) PROFILE="frontend-w2" ;;
            3) PROFILE="frontend-w3" ;;
            4) PROFILE="frontend-w4" ;;
            5) PROFILE="frontend-w5" ;;
            *) PROFILE="frontend" ;;
          esac
          
          # Start additional kaswallet services
          for i in $$(seq 1 $$((NUM_WORKERS-1))); do
            echo "  Starting kaswallet-$$i..."
            
            # Remove any container stuck in created/exited state
            CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "kaswallet-$$i" 2>/dev/null || echo "")
            if [ "$$CONTAINER_STATE" = "created" ] || [ "$$CONTAINER_STATE" = "exited" ]; then
              echo "    Removing stuck container kaswallet-$$i (state: $$CONTAINER_STATE)..."
              docker rm -f "kaswallet-$$i" >/dev/null 2>&1 || true
            fi
            
            docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile $$PROFILE up -d --remove-orphans kaswallet-$$i
            sleep 2
            
            CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "kaswallet-$$i" 2>/dev/null || echo "missing")
            if [ "$$CONTAINER_STATE" != "running" ]; then
              echo "    ⚠️  Kaswallet-$$i failed to start (state: $$CONTAINER_STATE), removing and retrying..."
              docker rm -f "kaswallet-$$i" >/dev/null 2>&1 || true
              docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile $$PROFILE up -d --force-recreate kaswallet-$$i
              
              # Verify again
              sleep 2
              CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "kaswallet-$$i" 2>/dev/null || echo "missing")
              if [ "$$CONTAINER_STATE" != "running" ]; then
                echo "    ❌ Kaswallet-$$i still not running after retry (state: $$CONTAINER_STATE)"
              fi
            fi
            echo "  ✅ Kaswallet-$$i started"
          done
          
          echo "✅ Additional workers started"
        fi
        
        echo "▶ Starting backend services..."
        
        # Remove any containers stuck in created/exited state before starting
        for container in execution-layer block-builder viaduct; do
          CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "$$container" 2>/dev/null || echo "")
          if [ "$$CONTAINER_STATE" = "created" ] || [ "$$CONTAINER_STATE" = "exited" ]; then
            echo "  Removing stuck container $$container (state: $$CONTAINER_STATE)..."
            docker rm -f "$$container" >/dev/null 2>&1 || true
          fi
        done
        
        docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile backend up -d --remove-orphans execution-layer block-builder viaduct
        
        # Verify containers actually started and are running (not just created)
        sleep 3
        for container in execution-layer block-builder viaduct; do
          CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "$$container" 2>/dev/null || echo "missing")
          if [ "$$CONTAINER_STATE" != "running" ]; then
            echo "  ⚠️  $$container is not running (state: $$CONTAINER_STATE), removing and retrying..."
            docker rm -f "$$container" >/dev/null 2>&1 || true
          fi
        done
        
        # Retry any failed containers with force-recreate
        FAILED_CONTAINERS=$$(for container in execution-layer block-builder viaduct; do
          CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "$$container" 2>/dev/null || echo "missing")
          if [ "$$CONTAINER_STATE" != "running" ]; then
            echo "$$container"
          fi
        done)
        
        if [ -n "$$FAILED_CONTAINERS" ]; then
          echo "  Retrying failed containers with force-recreate..."
          docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile backend up -d --force-recreate $$FAILED_CONTAINERS
          
          # Verify again after retry
          sleep 3
          for container in $$FAILED_CONTAINERS; do
            CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "$$container" 2>/dev/null || echo "missing")
            if [ "$$CONTAINER_STATE" != "running" ]; then
              echo "  ❌ $$container still not running after retry (state: $$CONTAINER_STATE)"
            fi
          done
        fi
        
        echo "✅ Backend services started"
        
        echo "▶ Waiting for backend to initialize..."
        timeout 300 bash -c "until docker exec execution-layer bash -c 'test -S /root/reth/socket/auth.ipc' 2>/dev/null; do sleep 10; done"
        timeout 300 bash -c "until docker exec block-builder bash -c '(command -v nc >/dev/null && nc -z localhost 8561) || (command -v bash >/dev/null && bash -c \"echo > /dev/tcp/localhost/8561\" 2>/dev/null) || (command -v wget >/dev/null && wget -q -O /dev/null http://localhost:8561 2>/dev/null)' 2>/dev/null; do sleep 10; done"
        
        echo "▶ Waiting for execution-layer to be healthy..."
        timeout 300 bash -c "until docker inspect --format='{{.State.Health.Status}}' execution-layer 2>/dev/null | grep -q 'healthy'; do sleep 10; done"
        
        echo "✅ Backend ready!"
        echo "▶ Starting RPC providers..."
        
        # Start RPC providers based on NUM_WORKERS
        if [ $$NUM_WORKERS -eq 1 ]; then
          # Remove any container stuck in created/exited state
          CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' rpc-provider-0 2>/dev/null || echo "")
          if [ "$$CONTAINER_STATE" = "created" ] || [ "$$CONTAINER_STATE" = "exited" ]; then
            echo "  Removing stuck container rpc-provider-0 (state: $$CONTAINER_STATE)..."
            docker rm -f rpc-provider-0 >/dev/null 2>&1 || true
          fi
          
          docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile frontend up -d --remove-orphans rpc-provider-0
          sleep 2
          
          CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' rpc-provider-0 2>/dev/null || echo "missing")
          if [ "$$CONTAINER_STATE" != "running" ]; then
            echo "  ⚠️  RPC provider-0 failed to start (state: $$CONTAINER_STATE), removing and retrying..."
            docker rm -f rpc-provider-0 >/dev/null 2>&1 || true
            docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile frontend up -d --force-recreate rpc-provider-0
            
            # Verify again
            sleep 2
            CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' rpc-provider-0 2>/dev/null || echo "missing")
            if [ "$$CONTAINER_STATE" != "running" ]; then
              echo "  ❌ RPC provider-0 still not running after retry (state: $$CONTAINER_STATE)"
            fi
          fi
          echo "✅ RPC provider-0 started"
          
          echo "▶ Waiting for RPC to initialize..."
          timeout 300 bash -c "until docker inspect --format='{{.State.Health.Status}}' rpc-provider-0 2>/dev/null | grep -q 'healthy'; do sleep 10; done"
          echo "✅ RPC provider-0 ready!"
        else
          # Determine profile for RPC providers
          case $$NUM_WORKERS in
            2) PROFILE="frontend-w2" ;;
            3) PROFILE="frontend-w3" ;;
            4) PROFILE="frontend-w4" ;;
            5) PROFILE="frontend-w5" ;;
            *) PROFILE="frontend" ;;
          esac
          
          # Start all RPC providers for workers
          for i in $$(seq 0 $$((NUM_WORKERS-1))); do
            echo "  Starting rpc-provider-$$i..."
            
            # Remove any container stuck in created/exited state
            CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "rpc-provider-$$i" 2>/dev/null || echo "")
            if [ "$$CONTAINER_STATE" = "created" ] || [ "$$CONTAINER_STATE" = "exited" ]; then
              echo "    Removing stuck container rpc-provider-$$i (state: $$CONTAINER_STATE)..."
              docker rm -f "rpc-provider-$$i" >/dev/null 2>&1 || true
            fi
            
            docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile $$PROFILE up -d --remove-orphans rpc-provider-$$i
            sleep 2
            
            CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "rpc-provider-$$i" 2>/dev/null || echo "missing")
            if [ "$$CONTAINER_STATE" != "running" ]; then
              echo "    ⚠️  RPC provider-$$i failed to start (state: $$CONTAINER_STATE), removing and retrying..."
              docker rm -f "rpc-provider-$$i" >/dev/null 2>&1 || true
              docker compose -f docker-compose.full.yml --project-directory "$$COMPOSE_HOST_PATH" --env-file "$$COMPOSE_ENV_FILE" --project-name igra-orchestra-$${NETWORK}-full --profile $$PROFILE up -d --force-recreate rpc-provider-$$i
              
              # Verify again
              sleep 2
              CONTAINER_STATE=$$(docker inspect --format='{{.State.Status}}' "rpc-provider-$$i" 2>/dev/null || echo "missing")
              if [ "$$CONTAINER_STATE" != "running" ]; then
                echo "    ❌ RPC provider-$$i still not running after retry (state: $$CONTAINER_STATE)"
              fi
            fi
            echo "  ✅ RPC provider-$$i started"
          done
          
          echo "▶ Waiting for RPC providers to initialize..."
          for i in $$(seq 0 $$((NUM_WORKERS-1))); do
            timeout 300 bash -c "until docker inspect --format='{{.State.Health.Status}}' rpc-provider-$$i 2>/dev/null | grep -q 'healthy'; do sleep 10; done" || true
            echo "  ✅ RPC provider-$$i ready"
          done
          echo "✅ All RPC providers ready!"
        fi
        
        WALLET_ADDR=$$(docker logs kaswallet-0 2>/dev/null | grep -oE "kaspatest:[a-zA-Z0-9]+" | head -1)
        
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "   ✅ DEPLOYMENT COMPLETE!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "🔑 Wallet Address (Worker 0):"
        echo "   $$WALLET_ADDR"
        echo ""
        echo "🌐 RPC Endpoint:"
        echo "   https://$${IGRA_ORCHESTRA_DOMAIN}:8545/{TOKEN}"
        echo ""
        echo "📊 Workers: $$NUM_WORKERS"
        echo ""
        echo "Run ./scripts/check-status.sh for details"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "Orchestrator completed successfully. Exiting..."
        exit 0
        ENDBASH
    depends_on:
      - kaspad
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/compose:ro
    working_dir: /compose
    environment:
      - NETWORK=${NETWORK}
      - IGRA_ORCHESTRA_DOMAIN=${IGRA_ORCHESTRA_DOMAIN}
      - NUM_WORKERS=${NUM_WORKERS:-1}

  # CORE SERVICES
  execution-layer:
    <<: *default-service
    restart: "no"
    container_name: execution-layer
    image: igranetwork/reth:1.7.0
    entrypoint: /root/reth/run-igra-dev-el.sh
    profiles: ["backend"]
    expose:
      - "8545"
      - "8546"
      - "8551"
      - "9001"
    environment:
      L1_REFERENCE_TIMESTAMP: ${L1_REFERENCE_TIMESTAMP}
      L1_REFERENCE_DAA_SCORE: ${L1_REFERENCE_DAA_SCORE}
      CHAIN_ID: ${IGRA_CHAIN_ID}
      ONE_TIME_ADDRESS: ${EL_ONE_TIME_ADDRESS}
      IGRA_LAUNCH_DAA_SCORE: ${IGRA_LAUNCH_DAA_SCORE}
    volumes:
      - ./keys/jwt.hex:/root/reth/jwt.hex
      - ./build/repos/execution-layer/genesis.template.json:/root/reth/genesis.template.json
      - ./build/repos/execution-layer/run-igra-dev-el.sh:/root/reth/run-igra-dev-el.sh
      - reth_ipc:/root/reth/socket
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.el_stats.rule=Host(`${IGRA_ORCHESTRA_DOMAIN}`)"
      - "traefik.http.routers.el_stats.entrypoints=el_stats"
      - "traefik.http.routers.el_stats.service=el_stats_svc"
      - "traefik.http.routers.el_stats.tls=true"
      - "traefik.http.routers.el_stats.tls.certresolver=myresolver"
      - "traefik.http.services.el_stats_svc.loadbalancer.server.port=9001"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "bash", "-c", "test -S /root/reth/socket/auth.ipc"]

  node-health-check-client:
    image: igranetwork/node-health-check-client:v0.2.2
    container_name: node-health-check-client
    networks:
      - igra-network
    environment:
      - NODE_RPC_URL=http://execution-layer:8545
      - MONITOR_URL= http://65.108.195.238:8081
      - NODE_ID=igra-orchestra-${NODE_ID}
      - API_KEY=${HEALTH_CHECK_API_KEY}
      - POLL_INTERVAL=5
    restart: unless-stopped

  block-builder:
    <<: *default-service
    restart: "no"
    image: igranetwork/block-builder:v0.2.2
    command: /app/jwt.hex http://execution-layer
    profiles: ["backend"]
    container_name: block-builder
    expose:
      - "8561"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      L1_REFERENCE_TIMESTAMP: ${L1_REFERENCE_TIMESTAMP}
      L1_REFERENCE_DAA_SCORE: ${L1_REFERENCE_DAA_SCORE}
      GENESIS_BLOCK_HASH: ${GENESIS_BLOCK_HASH}
      MIN_PROTOCOL_FEE_PER_GAS_GWEI: ${MIN_PROTOCOL_FEE_PER_GAS_GWEI}
      ENABLE_PERF_DIAGNOSTICS: ${ENABLE_PERF_DIAGNOSTICS}
      EL_IPC_PATH: /app/reth/auth.ipc
    volumes:
      - ./keys/jwt.hex:/app/jwt.hex:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - reth_ipc:/app/reth
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "bash", "-c", "echo hello > /dev/tcp/$$HOSTNAME/8561"]
    depends_on:
      execution-layer:
        condition: service_healthy

  viaduct:
    <<: *default-service
    restart: unless-stopped
    image: igranetwork/viaduct:v0.2.2
    profiles: ["backend"]
    container_name: viaduct
    environment:
      - RUST_LOG
      - REPLAY_ON_ERROR
      - SYNC_THREADS
      - IGRA_LAUNCH_DAA_SCORE
      - MAGIC_SPK
      - DELAY_WINDOWS
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:-igralabs-viaduct-archival-data}
      - S3_BACKUP_REGION=${S3_BACKUP_REGION:-eu-north-1}
      - FORCE_RESTORE_BACKUP=${FORCE_RESTORE_BACKUP:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/app/viaduct-entrypoint.sh"]
    command: ["--ip-port=${KASPAD_HOST}:${KASPAD_BORSH_PORT}", "--bb-ip-port=block-builder:8561"]
    volumes:
      - viaduct_data:/app/storage
      - ./build/viaduct-entrypoint.sh:/app/viaduct-entrypoint.sh:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
        reservations:
          memory: 4G
          cpus: '1.0'
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "bash", "-c", "echo hello > /dev/tcp/${KASPAD_HOST}/${KASPAD_BORSH_PORT}"]
    depends_on:
      block-builder:
        condition: service_healthy

  # TRAEFIK SERVICE
  traefik:
    <<: *default-service
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.rpc.address=:8545"
      - "--entrypoints.explorer_http.address=:8008"
      - "--entrypoints.explorer_ws.address=:8001"
      - "--entrypoints.explorer_rest.address=:8010"
      - "--entrypoints.kaspad_grpc.address=:16210"
      - "--entrypoints.kaspad_borsh.address=:17210"
      - "--entrypoints.kaspad_json.address=:18210"
      - "--entrypoints.el_stats.address=:9001"
      - "--log.level=DEBUG"
      - "--certificatesresolvers.myresolver.acme.email=${IGRA_ORCHESTRA_DOMAIN_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8001:8001"
      - "8010:8010"
      - "8545:8545"
      - "9001:9001"
      - "17611:17210"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik:/etc/traefik
      - traefik_certs:/letsencrypt
    networks:
      - igra-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-token.stripprefixregex.regex=^/([a-f0-9]{32})"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"
      # Add redirect middleware for HTTP to HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # Apply redirect to web entrypoint for the specified host
      - "traefik.http.routers.web-redirect.rule=Host(`${IGRA_ORCHESTRA_DOMAIN}`)"
      - "traefik.http.routers.web-redirect.entrypoints=web"
      - "traefik.http.routers.web-redirect.middlewares=redirect-to-https"
      # Define a router for websecure (HTTPS)
      - "traefik.http.routers.websecure-router.rule=Host(`${IGRA_ORCHESTRA_DOMAIN}`)"
      - "traefik.http.routers.websecure-router.entrypoints=websecure"
      - "traefik.http.routers.websecure-router.tls=true"
      - "traefik.http.routers.websecure-router.tls.certresolver=myresolver"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--spider", "http://localhost:8080"]
      timeout: 5s

  # WORKER SERVICES
  rpc-provider-0:
    <<: *rpc-provider-base
    profiles: ["frontend"]
    container_name: rpc-provider-0
    environment:
      <<: *rpc-provider-environment
      WALLET_DAEMON_URI: http://kaswallet-0:8082
      WALLET_TO_ADDRESS: ${W0_WALLET_TO_ADDRESS:-auto}
      KASWALLET_PASSWORD: ${W0_KASWALLET_PASSWORD:-}
    volumes:
      - shared_config:/shared
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8535 && \
          echo hello > /dev/tcp/execution-layer/8545 && \
          echo hello > /dev/tcp/kaswallet-0/8082",
        ]
    depends_on:
      execution-layer:
        condition: service_healthy
      kaswallet-0:
        condition: service_healthy

  kaswallet-0:
    <<: *kaswallet-base
    container_name: kaswallet-0
    ports:
      - "127.0.0.1:8082:8082"  # open 8082 on localhost for entry transactions
    volumes:
      - ./keys/wallet-0:/keys
      - shared_config:/shared
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8082 && \
          echo hello > /dev/tcp/${KASPAD_HOST}/${KASPAD_BORSH_PORT}",
        ]

  # Additional workers
  rpc-provider-1:
    <<: *rpc-provider-base
    profiles: ["frontend-w2", "frontend-w3", "frontend-w4", "frontend-w5", "rpc-providers"]
    container_name: rpc-provider-1
    environment:
      <<: *rpc-provider-environment
      WALLET_DAEMON_URI: http://kaswallet-1:8082
      WALLET_TO_ADDRESS: ${W1_WALLET_TO_ADDRESS}
      KASWALLET_PASSWORD: ${W1_KASWALLET_PASSWORD}
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8535 && \
          echo hello > /dev/tcp/execution-layer/8545 && \
          echo hello > /dev/tcp/kaswallet-1/8082",
        ]
    depends_on:
      execution-layer:
        condition: service_healthy
      kaswallet-1:
        condition: service_healthy

  kaswallet-1:
    <<: *kaswallet-base
    profiles: ["frontend-w2", "frontend-w3", "frontend-w4", "frontend-w5", "kaswallets"]
    container_name: kaswallet-1
    volumes:
      - ./keys/wallet-1:/keys
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8082 && \
          echo hello > /dev/tcp/${KASPAD_HOST}/${KASPAD_BORSH_PORT}",
        ]

  # Worker 3
  rpc-provider-2:
    <<: *rpc-provider-base
    profiles: ["frontend-w3", "frontend-w4", "frontend-w5", "rpc-providers"]
    container_name: rpc-provider-2
    environment:
      <<: *rpc-provider-environment
      WALLET_DAEMON_URI: http://kaswallet-2:8082
      WALLET_TO_ADDRESS: ${W2_WALLET_TO_ADDRESS}
      KASWALLET_PASSWORD: ${W2_KASWALLET_PASSWORD}
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8535 && \
          echo hello > /dev/tcp/execution-layer/8545 && \
          echo hello > /dev/tcp/kaswallet-2/8082",
        ]
    depends_on:
      execution-layer:
        condition: service_healthy
      kaswallet-2:
        condition: service_healthy

  kaswallet-2:
    <<: *kaswallet-base
    profiles: ["frontend-w3", "frontend-w4", "frontend-w5", "kaswallets"]
    container_name: kaswallet-2
    volumes:
      - ./keys/wallet-2:/keys
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8082 && \
          echo hello > /dev/tcp/${KASPAD_HOST}/${KASPAD_BORSH_PORT}",
        ]

  # Worker 4
  rpc-provider-3:
    <<: *rpc-provider-base
    profiles: ["frontend-w4", "frontend-w5", "rpc-providers"]
    container_name: rpc-provider-3
    environment:
      <<: *rpc-provider-environment
      WALLET_DAEMON_URI: http://kaswallet-3:8082
      WALLET_TO_ADDRESS: ${W3_WALLET_TO_ADDRESS}
      KASWALLET_PASSWORD: ${W3_KASWALLET_PASSWORD}
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8535 && \
          echo hello > /dev/tcp/execution-layer/8545 && \
          echo hello > /dev/tcp/kaswallet-3/8082",
        ]
    depends_on:
      execution-layer:
        condition: service_healthy
      kaswallet-3:
        condition: service_healthy

  kaswallet-3:
    <<: *kaswallet-base
    profiles: ["frontend-w4", "frontend-w5", "kaswallets"]
    container_name: kaswallet-3
    volumes:
      - ./keys/wallet-3:/keys
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8082 && \
          echo hello > /dev/tcp/${KASPAD_HOST}/${KASPAD_BORSH_PORT}",
        ]

  # Worker 5
  rpc-provider-4:
    <<: *rpc-provider-base
    profiles: ["frontend-w5", "rpc-providers"]
    container_name: rpc-provider-4
    environment:
      <<: *rpc-provider-environment
      WALLET_DAEMON_URI: http://kaswallet-4:8082
      WALLET_TO_ADDRESS: ${W4_WALLET_TO_ADDRESS}
      KASWALLET_PASSWORD: ${W4_KASWALLET_PASSWORD}
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8535 && \
          echo hello > /dev/tcp/execution-layer/8545 && \
          echo hello > /dev/tcp/kaswallet-4/8082",
        ]
    depends_on:
      execution-layer:
        condition: service_healthy
      kaswallet-4:
        condition: service_healthy

  kaswallet-4:
    <<: *kaswallet-base
    profiles: ["frontend-w5", "kaswallets"]
    container_name: kaswallet-4
    volumes:
      - ./keys/wallet-4:/keys
    healthcheck:
      <<: *default-healthcheck
      test: [
          "CMD",
          "bash",
          "-c",
          "echo hello > /dev/tcp/$$HOSTNAME/8082 && \
          echo hello > /dev/tcp/${KASPAD_HOST}/${KASPAD_BORSH_PORT}",
        ]

  # KASPA SERVICES
  kaspad:
    <<: *default-service
    image: kaspad
    container_name: kaspad
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    expose:
      - "16210" # GRPC Server
      - "16211" # P2P Server
      - "17210" # WRPC (borsh) Server
      - "18210" # WRPC (json) Server
    ports:
      - "17210:17210"
      - "16211:16211"
    environment:
      - RUST_LOG
      - REPLAY_ON_ERROR
      - SYNC_THREADS
      - KASPAD_ADD_PEER
    entrypoint: |
      sh -c '
      ARGS="--${NETWORK} --disable-upnp --nodnsseed --rpclisten-borsh=0.0.0.0 --rpclisten=0.0.0.0 --rpclisten-json=0.0.0.0 --listen=0.0.0.0 --loglevel=info --utxoindex --appdir=/app/data"
      if [ -n "$$KASPAD_ADD_PEER" ]; then
        ARGS="$$ARGS --addpeer=$$KASPAD_ADD_PEER"
      else
        ARGS="$$ARGS --enable-unsynced-mining"
      fi
      # Start kaspad and tee output to both stdout and log file for healthcheck
      exec /app/kaspad $$ARGS 2>&1 | tee /app/data/kaspad.log
      '
    volumes:
      - kaspad_data:/app/data/
      - ./build/kaspad-healthcheck.sh:/app/kaspad-healthcheck.sh:ro
    networks:
      - igra-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.kaspad-grpc.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.kaspad-grpc.entrypoints=kaspad_grpc"
      - "traefik.tcp.routers.kaspad-grpc.service=kaspad-grpc-svc"
      - "traefik.tcp.services.kaspad-grpc-svc.loadbalancer.server.port=16210"
      - "traefik.tcp.routers.kaspad-json.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.kaspad-json.entrypoints=kaspad_json"
      - "traefik.tcp.routers.kaspad-json.service=kaspad-json-svc"
      - "traefik.tcp.services.kaspad-json-svc.loadbalancer.server.port=18210"
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 7200s
      test: ["CMD", "/app/kaspad-healthcheck.sh"]
